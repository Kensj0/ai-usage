<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-förbrukning</title>
<style>
:root {
  --bg: #f7f6f2;
  --fg: #1d1d1b;
  --muted: #6b6a64;
  --line: #d9d6cc;
  --track: #ffffff;
  --bar: #1d1d1b;
  --warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171816;
    --fg: #ecebe6;
    --muted: #a3a197;
    --line: #3a3b36;
    --track: #222420;
    --bar: #ecebe6;
    --warn: #e0a24a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171816;
  --fg: #ecebe6;
  --muted: #a3a197;
  --line: #3a3b36;
  --track: #222420;
  --bar: #ecebe6;
  --warn: #e0a24a;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
main { display: grid; gap: 16px; max-width: 520px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0; }
h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}
section { display: grid; gap: 6px; min-width: 0; }
p { margin: 0; }
.bar {
  height: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--track);
}
.bar span { display: block; height: 100%; background: var(--bar); }
.warn, .bar span.warn { color: var(--warn); background: var(--warn); }
p.warn { background: none; }
.counts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 8px;
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.counts div { min-width: 0; }
.counts dt { font-size: 12px; color: var(--muted); }
.counts dd { margin: 0; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--muted); }
.error { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>AI-förbrukning</h1>
  <div id="error" class="error" hidden></div>
  <div id="content"><p class="note">Laddar…</p></div>
</main>
<script>
"use strict";

const REFRESH_MS = 60_000;
const count = (value) => value.toLocaleString("sv-SE");
const clock = (iso) => new Date(iso).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });

// Samma beräkning som ai-usage-panelen i Jarri: förbrukningen hittills i fönstret,
// extrapolerad till 100 % vid nuvarande takt.
function exhaustsInMs(meter, now) {
  if (meter.since === undefined || meter.percentUsed <= 0) return undefined;
  const elapsed = now - meter.since;
  if (elapsed <= 0) return undefined;
  const perMs = meter.percentUsed / elapsed;
  return Math.max(0, (100 - meter.percentUsed) / perMs);
}

function durationLabel(ms) {
  const minutes = Math.max(0, Math.round(ms / 60_000));
  const hours = Math.floor(minutes / 60);
  return hours > 0 ? `${hours} h ${minutes % 60} min` : `${minutes} min`;
}

function windowLabel(kind) {
  if (kind === "five_hour") return "5-timmarsfönstret";
  if (kind === "seven_day") return "Veckofönstret";
  return kind;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key === "className") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function tokenCounts(tokens) {
  const item = (label, value) => el("div", {}, [el("dt", { text: label }), el("dd", { text: count(value) })]);
  return el("dl", { className: "counts" }, [
    item("in", tokens.input),
    item("ut", tokens.output),
    item("cache skrivet", tokens.cacheWrite),
    item("cache läst", tokens.cacheRead),
    item("svar", tokens.messages),
  ]);
}

function meterCard(meter, now) {
  const exhaust = exhaustsInMs(meter, now);
  const resetIn = meter.resetsAt === undefined ? undefined : Date.parse(meter.resetsAt) - now;
  const beforeReset = exhaust !== undefined && resetIn !== undefined && exhaust < resetIn;
  const fill = Math.min(100, Math.max(0, meter.percentUsed));
  const label = windowLabel(meter.kind);

  const bar = el("div", {
    className: "bar",
    role: "meter",
    "aria-label": label,
    "aria-valuemin": "0",
    "aria-valuemax": "100",
    "aria-valuenow": String(fill),
  }, [el("span", { className: beforeReset ? "warn" : "", style: `width:${fill}%` })]);

  const parts = [
    el("h2", { text: label }),
    bar,
    el("p", { text: `${meter.percentUsed.toFixed(1)} % använt · ${(100 - meter.percentUsed).toFixed(1)} % kvar` }),
  ];
  if (resetIn !== undefined && meter.resetsAt !== undefined) {
    parts.push(el("p", { text: `Återställs om ${durationLabel(resetIn)} (kl ${clock(meter.resetsAt)})` }));
  }
  if (exhaust !== undefined) {
    const text = `Vid nuvarande takt: slut om ${durationLabel(exhaust)}` +
      (beforeReset ? " (före återställning)" : " (räcker till återställning)");
    parts.push(el("p", { className: beforeReset ? "warn" : "", text }));
  }
  if (meter.tokens !== undefined) parts.push(tokenCounts(meter.tokens));
  return el("section", {}, parts);
}

function windowSection(title, tokens) {
  return el("section", {}, [
    el("h2", { text: title }),
    tokens ? tokenCounts(tokens) : el("p", { className: "note", text: "Inga tokens hittades." }),
  ]);
}

function render(snapshot) {
  const { now, limits, tokens, fiveHourStart, sevenDayStart } = snapshot;
  const nodes = [];
  if (limits) {
    for (const meter of limits.meters) nodes.push(meterCard(meter, now));
    if (limits.costUsd !== undefined) {
      nodes.push(el("p", { className: "note", text: `Kostnad denna session: $${limits.costUsd.toFixed(2)}` }));
    }
    nodes.push(el("p", {
      className: "note",
      text: `Kvoten uppmättes ${new Date(limits.measuredAt).toLocaleTimeString("sv-SE")}. Uppdateras av ai-usage-panelen i Claude Code.`,
    }));
  } else {
    nodes.push(el("p", {
      className: "note",
      text: "Ingen kvotdata. Öppna /ai-usage i en Claude Code-session för att se procent och återställning.",
    }));
  }
  nodes.push(el("hr"));
  nodes.push(windowSection("Senaste 5 timmarna", tokens[String(fiveHourStart)]));
  nodes.push(windowSection("Senaste 7 dagarna", tokens[String(sevenDayStart)]));
  document.getElementById("content").replaceChildren(...nodes);
}

async function refresh() {
  const errorBox = document.getElementById("error");
  try {
    const response = await fetch("/snapshot", { cache: "no-store" });
    if (!response.ok) throw new Error(`tjänsten svarade ${response.status}`);
    render(await response.json());
    errorBox.hidden = true;
  } catch (failure) {
    errorBox.textContent = String(failure);
    errorBox.hidden = false;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
